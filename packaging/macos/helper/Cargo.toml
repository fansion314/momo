[package]
name = "clash-momo-helper"
version = "2.0.4"
edition = "2024"
publish = false

[[bin]]
name = "clash-momo-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time", "signal", "sync", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
url = "2"
zeroize = "1.9.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
