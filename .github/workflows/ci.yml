name: clash-momo checks
on:
  push:
    branches: ['clash-momo']
  pull_request:
    branches: ['clash-momo']
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm base-devel git nodejs pnpm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Run checks as an ordinary user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -e <<'CHECKS'
          cd "$GITHUB_WORKSPACE"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --package=vite-plus@1.4.0 dlx vp run format:check
          pnpm --package=vite-plus@1.4.0 dlx vp run lint:check
          pnpm --package=vite-plus@1.4.0 dlx vp run typecheck
          pnpm --package=vite-plus@1.4.0 dlx vp run test
          CHECKS
