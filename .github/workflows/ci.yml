name: clash-momo checks
on:
  push:
    branches: ['clash-momo']
  pull_request:
    branches: ['clash-momo']
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm base-devel git go nodejs pnpm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Run checks as an ordinary user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -e <<'CHECKS'
          cd "$GITHUB_WORKSPACE"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --package=vite-plus@1.4.0 dlx vp run format:check
          pnpm --package=vite-plus@1.4.0 dlx vp run lint:check
          pnpm --package=vite-plus@1.4.0 dlx vp run typecheck
          pnpm --package=vite-plus@1.4.0 dlx vp run test
          CHECKS
      - name: Verify helper security and race checks in the disposable container
        working-directory: packaging/macos/helper
        run: go test -race -count=1 ./...
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          check-latest: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: packaging/macos/helper/go.mod
          check-latest: true
          cache: false
      - run: npm install --global pnpm@11.8.0
      - run: go test -race ./...
        working-directory: packaging/macos/helper
      - run: bash packaging/macos/test-network-ci.sh
      - run: bash packaging/macos/build-ci.sh
      - name: Exercise the privileged service with the released core
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/macos/test-service-ci.sh
      - name: Check out the pinned application startup test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fansion314/packages
          ref: 708c7a597893e9a1361bdbb87674d840da928b5a
          path: .distribution
          persist-credentials: false
      - name: Start the actual app with its Homebrew core
        run: |
          brew tap fansion314/packages https://github.com/fansion314/packages.git
          brew trust fansion314/packages
          brew install --formula fansion314/packages/mihomomo
          bash .distribution/homebrew/scripts/test-clash-momo.sh "$PWD/dist/macos/Clash Momo.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clash-momo-macos
          path: dist/release/*
          if-no-files-found: error
