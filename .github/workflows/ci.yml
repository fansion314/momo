name: mihomomo checks
on:
  push:
    branches: ['mihomomo']
  pull_request:
    branches: ['mihomomo']
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm base-devel git go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Run checks as an ordinary user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -e <<'CHECKS'
          cd "$GITHUB_WORKSPACE"
          go test -tags with_gvisor ./...
          go test -p 1 -race -tags with_gvisor ./component/traffic_history ./tunnel/statistic ./config ./hub/route
          CHECKS
      - name: Exercise protected paths in the disposable root container
        run: go test -count=1 -v ./constant
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: go test -tags with_gvisor ./...
      - run: go test -p 1 -race -tags with_gvisor ./component/traffic_history ./tunnel/statistic ./config ./hub/route
      - run: bash packaging/macos/build-ci.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mihomomo-macos
          path: dist/release/*
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Native Windows unit and history checks
        run: go test -tags with_gvisor ./...
      - name: Build and verify native Windows release
        run: python packaging/windows/build.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mihomomo-windows
          path: dist/release/*
          if-no-files-found: error
