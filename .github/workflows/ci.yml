name: clash-momo checks
on:
  push:
    branches: ['clash-momo']
  pull_request:
    branches: ['clash-momo']
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/momo-helper-sccache
    steps:
      - run: pacman -Syu --noconfirm base-devel git go nodejs pnpm rustup sccache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Run checks as an ordinary user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -e <<'CHECKS'
          cd "$GITHUB_WORKSPACE"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --package=vite-plus@1.4.0 dlx vp run format:check
          pnpm --package=vite-plus@1.4.0 dlx vp run lint:check
          pnpm --package=vite-plus@1.4.0 dlx vp run typecheck
          pnpm --package=vite-plus@1.4.0 dlx vp run test
          CHECKS
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/momo-helper-sccache
          key: helper-linux-${{ hashFiles('packaging/macos/helper/Cargo.lock', 'packaging/macos/helper/rust-toolchain.toml') }}
          restore-keys: helper-linux-
      - name: Verify Rust helper security and concurrency checks
        working-directory: packaging/macos/helper
        run: |
          rustup show
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /tmp/momo-helper-sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          check-latest: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - run: brew install sccache
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/momo-helper-sccache
          key: helper-macos-${{ hashFiles('packaging/macos/helper/Cargo.lock', 'packaging/macos/helper/rust-toolchain.toml') }}
          restore-keys: helper-macos-
      - run: npm install --global pnpm@11.8.0
      - run: |
          rustup show
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
        working-directory: packaging/macos/helper
      - run: bash packaging/macos/test-network-ci.sh
      - run: bash packaging/macos/build-ci.sh
      - name: Exercise the privileged service with the released core
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/macos/test-service-ci.sh
      - name: Check out the pinned application startup test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fansion314/packages
          ref: e5281d1957a6f1bfdfd9c724d3498def8cc64e6c
          path: .distribution
          persist-credentials: false
      - name: Start the actual app with its Homebrew core
        run: |
          brew tap fansionia/tap https://github.com/fansion314/packages.git
          brew trust fansionia/tap
          brew install --formula fansionia/tap/mihomomo
          bash .distribution/homebrew/scripts/test-clash-momo.sh "$PWD/dist/macos/Clash Momo.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clash-momo-macos
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: clash-momo-helper-validation
          path: dist/validation/*
          if-no-files-found: ignore
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          check-latest: true
      - run: npm install --global pnpm@11.8.0
      - name: Build, install and exercise the bundled Windows client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/build-ci.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clash-momo-windows
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: clash-momo-windows-update-validation
          path: dist/validation/*
          if-no-files-found: ignore
      - name: Collect installed-client diagnostics
        if: failure()
        shell: pwsh
        run: |
          $logs = Join-Path $env:APPDATA 'clash-momo/logs'
          if (Test-Path $logs) {
            Copy-Item -LiteralPath $logs -Destination "$env:RUNNER_TEMP/clash-momo-windows-installed-logs" -Recurse -Force
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: clash-momo-windows-diagnostics
          path: |
            ${{ runner.temp }}/clash-momo-windows-smoke/**/data/logs/*
            ${{ runner.temp }}/clash-momo-windows-installed-logs/*
          if-no-files-found: ignore
