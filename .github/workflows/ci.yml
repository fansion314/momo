name: mihomomo checks
on:
  push:
    branches: ['mihomomo']
  pull_request:
    branches: ['mihomomo']
  workflow_call:
    secrets:
      TIZI_BUILD_KEYS:
        required: false
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm base-devel git go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Run checks as an ordinary user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -e <<'CHECKS'
          cd "$GITHUB_WORKSPACE"
          go test -tags with_gvisor ./...
          go test -race -tags with_gvisor,tizi ./component/tizi ./tunnel/statistic ./config ./hub/route
          CHECKS
      - name: Exercise protected paths in the disposable root container
        run: go test -count=1 -v ./constant
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -tags with_gvisor ./...
      - run: go test -race -tags with_gvisor,tizi ./component/tizi ./tunnel/statistic ./config ./hub/route
      - run: bash packaging/macos/build-ci.sh
        env:
          TIZI_BUILD_KEYS: ${{ github.event_name != 'pull_request' && secrets.TIZI_BUILD_KEYS || '' }}
          TIZI_REQUIRE_BUILD_KEYS: ${{ (startsWith(github.ref, 'refs/tags/mihomomo-v') || inputs.source_sha != '') && 'true' || 'false' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mihomomo-macos
          path: dist/release/*
          if-no-files-found: error
